name: Bug di Plancia
description: Segnala un problema della console web Plancia.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Comportamento osservato
      description: Passaggi per riprodurre, risultato ottenuto e risultato atteso.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Superficie
      options:
        - Web desktop
        - Web mobile / PWA
        - Sessione e API same-origin
        - Build o verifica del bundle
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Dettagli tecnici (senza dati personali)
      description: Versione browser, commit o messaggi di errore oscurati.
